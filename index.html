  path.bezierCurveTo(fromX, midY, toX, midY, toX, toY);
  mg.append("path").attr("class", "merge-path")
    .attr("d", path.toString()).attr("stroke", `url(#${gid})`).attr("stroke-width", 2.5)
    .on("mouseover", function(event) {
      d3.select(this).attr("stroke-width", 4);
      tooltip.style("display", "block").style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 28) + "px")
        .html(`<strong>${m.from_slug} &rarr; ${m.to_slug}</strong> (${m.year})<br>${m.description}`);
    })
    .on("mouseleave", function() { d3.select(this).attr("stroke-width", 2.5); tooltip.style("display", "none"); });
  mg.append("circle").attr("class", "merge-endpoint")
    .attr("cx", toX).attr("cy", toY).attr("r", 3).attr("fill", colorOf[m.to_slug]);
});

// Predecessor bridges: a horizontal dotted line on a shared row (e.g. Stern Electronics -> Stern)
const bridgesG = g.append("g").attr("id", "bridges");
data.bridges.forEach(br => {
  const yy = ymap[br.to_slug];
  if (yy === undefined) return;
  const bg = bridgesG.append("g").attr("class", "bridge");
  bg.append("title").text(`${br.from_slug} \u2192 ${br.to_slug}: ${br.description}`);
  bg.append("line").attr("class", "bridge-line")
    .attr("x1", x(br.start + 0.5)).attr("x2", x(br.end + 0.5))
    .attr("y1", yy).attr("y2", yy)
    .attr("stroke", colorOf[br.to_slug]).attr("stroke-width", 2).attr("stroke-dasharray", "2 4");
});

// Succession / event dots
const dotsG = g.append("g").attr("id", "dot-events");
data.dot_events.forEach(evt => {
  const cy = ymap[evt.slug];
  if (cy === undefined) return;
  const dg = dotsG.append("g").attr("class", `dot dot--${evt.type}`);
  dg.append("title").text(`${evt.slug} (${evt.year}): ${evt.description}`);
  dg.append("circle").attr("class", "dot-event")
    .attr("cx", x(evt.year + 0.5)).attr("cy", cy).attr("r", 4)
    .attr("fill", "#fff").attr("stroke", colorOf[evt.slug]).attr("stroke-width", 2)
    .on("mouseover", function(event) {
      d3.select(this).attr("r", 6);
      tooltip.style("display", "block").style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 28) + "px")
        .html(`<strong>${evt.slug}</strong> (${evt.year})<br>${evt.description}`);
    })
    .on("mouseleave", function() { d3.select(this).attr("r", 4); tooltip.style("display", "none"); });
});

// Title
svg.append("text").attr("class", "chart-title").attr("id", "chart-title")
  .attr("x", width / 2).attr("y", 30).attr("text-anchor", "middle")
  .text("Pinball Manufacturer Production Timeline v0.7 (" + data.year_range[0] + "\u2013" + data.year_range[1] + ")");
</script>
</body></html>
